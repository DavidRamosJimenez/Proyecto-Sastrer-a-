<body>
    <header>
        <h1>Óptica Mirasol</h1>
        <p>Óptica de barrio con atencion cercana: te agendamos tu cita para examen de vista, armazones y lentes de sol.</p>
    </header>

    <main>
        <form id="form-cita" novalidate method="POST" action="procesar.php">
            <div>
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label for="correo">Correo Electronico</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div>
                <label for="consulta">Sobre Que Quiere Consultar:</label>
                <textarea id="consulta" name="consulta"></textarea>
            </div>

            <button type="submit">Pedir mi cita</button>

            <p id="aviso-cita" class="aviso"></p>
        </form>
    </main>

    <footer>

    </footer>
